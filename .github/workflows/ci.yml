name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check every package
        run: npm run build
      - name: Test
        run: npm test
      - name: The sources must already be in canonical layout
        run: node packages/cli/dist/bin.js fmt examples --check
      - name: Check the worked examples
        run: node packages/cli/dist/bin.js check examples
      - name: Run the scenarios the examples declare
        run: node packages/cli/dist/bin.js test examples
      - name: A block written for one language must not compile as another
        shell: bash
        run: |
          if node packages/cli/dist/bin.js build examples/dispatch --language go --out should-fail; then
            echo "building a Go project from a TypeScript-only body should have failed"
            exit 1
          fi

  # The real proof: the emitted projects have to satisfy their own toolchains.
  # A backend that generates plausible-looking code that does not compile is
  # worse than no backend, so each one is built here with the real compiler.
  generated:
    name: Generated ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `sources` is not always every example. Three of them carry operations
          # written in a fenced target-language block, and a block is only
          # emitted for the language it names: building `examples/dispatch` as
          # Go is `HADL3060`, by design, because nothing in the source says what
          # that operation is in Go. Each target therefore compiles the examples
          # it actually has bodies for — which is also what keeps HADL3060
          # honest, since a regression that silently emitted an empty method
          # would turn this job green.
          # `npm test` is `tsc` plus the scenarios the compiler wrote as tests,
          # which is the only place a fenced TypeScript block is ever executed.
          - target: typescript
            sources: examples
            verify: npm install --no-audit --no-fund && npm test
          - target: java
            sources: examples/crud examples/orders examples/billing examples/guide examples/ledger
            verify: mvn -q -B compile
          - target: python
            sources: examples/crud examples/orders examples/billing examples/guide examples/ledger examples/matching
            verify: python -m compileall -q app
          # The generated go.mod carries requires but no go.sum, whose hashes
          # cannot be produced offline. Resolving them is the build's job.
          - target: go
            sources: examples/crud examples/orders examples/billing examples/guide examples/ledger
            verify: go mod tidy && go build ./...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No dependency cache on these two: the pom.xml and go.sum they key on do
      # not exist yet at setup time, because the project is generated later.
      - if: matrix.target == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.target == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.target == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - run: npm ci
      - run: npm run build
      - name: Compile the examples
        run: node packages/cli/dist/bin.js build ${{ matrix.sources }} --target ${{ matrix.target }} --out out
      - name: Build the generated project
        working-directory: out/${{ matrix.target }}
        run: ${{ matrix.verify }}

  # Rust is experimental. The emitter does not model ownership, so the crate it
  # writes does not compile: values are moved and then read, `&mut self` methods
  # move out of their own fields. This job runs anyway, because a gap that is
  # measured every day is a gap someone can close; it just does not hold the
  # rest of the project red while it is open.
  generated-rust:
    name: Generated rust (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - name: Compile the examples
        run: >-
          node packages/cli/dist/bin.js build
          examples/crud examples/orders examples/billing examples/guide examples/ledger
          --target rust --out out
      - name: Build the generated crate
        working-directory: out/rust
        run: cargo check --quiet

  infrastructure:
    name: Generated infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-helm@v4

      - run: npm ci
      - run: npm run build
      - name: Generate every platform
        run: node packages/cli/dist/bin.js deploy examples --target all --out out

      - name: docker compose config
        run: docker compose -f out/docker/docker-compose.yml config --quiet
      - name: helm lint
        run: for chart in out/kubernetes/charts/*/; do helm lint "$chart"; done
      - name: terraform validate
        working-directory: out/terraform
        run: terraform init -backend=false && terraform validate

  architect:
    name: Architect round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Draft sources from requirements
        run: node packages/cli/dist/bin.js architect examples/requirements/library.md --out drafted
      - name: The drafts must satisfy the compiler that wrote them
        run: node packages/cli/dist/bin.js check drafted/src
