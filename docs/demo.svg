<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 447" width="800" height="447" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
<title>HADL: the compiler catches a design mistake, the scenarios run without generating anything, then it compiles.</title>
