<rect width="800" height="447" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect width="800" height="34" rx="10" fill="#161b22"/>
<rect y="24" width="800" height="10" fill="#161b22"/>
<line x1="0" y1="34" x2="800" y2="34" stroke="#30363d"/>
<circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="38" cy="17" r="5" fill="#febc2e"/><circle cx="56" cy="17" r="5" fill="#28c840"/>
<text x="400" y="21" fill="#6e7681" text-anchor="middle" font-size="11">haic — the HADL compiler</text>
<g class="r0"><text x="22.0" y="62" fill="#7ee787" font-weight="600">$ </text><text x="36.4" y="62" fill="#c9d1d9">haic check src</text></g>
<g class="r1"><text x="22.0" y="91.45" fill="#ff7b72" font-weight="600">error</text><text x="58.1" y="91.45" fill="#ff7b72" font-weight="600">[HADL2207]</text><text x="130.3" y="91.45" fill="#c9d1d9">: aggregate Order embeds aggregate Customer</text></g>
<g class="r2"><text x="22.0" y="110.45" fill="#6e7681">  --&gt; </text><text x="65.3" y="110.45" fill="#6e7681">src/orders.hadl:12:3</text></g>
<g class="r3"><text x="22.0" y="129.45" fill="#6e7681">   |</text></g>
<g class="r4"><text x="22.0" y="148.45" fill="#6e7681">12 | </text><text x="58.1" y="148.45" fill="#c9d1d9">- customer: Customer, required</text></g>
<g class="r5"><text x="22.0" y="167.45" fill="#6e7681">   |   </text><text x="72.5" y="167.45" fill="#ff7b72">^^^^^^^^^^^^^^^^^^^^^^^^^^^^</text></g>
<g class="r6"><text x="22.0" y="186.45" fill="#d29922">  help: </text><text x="79.8" y="186.45" fill="#c9d1d9">store the identity instead: "- customerId: uuid, required"</text></g>
<g class="r7"><text x="22.0" y="215.89999999999998" fill="#7ee787" font-weight="600">$ </text><text x="36.4" y="215.89999999999998" fill="#c9d1d9">haic check src</text></g>
<g class="r8"><text x="22.0" y="245.34999999999997" fill="#3fb950">no problems found in 1 module, 1 bounded context</text></g>
<g class="r9"><text x="22.0" y="274.79999999999995" fill="#7ee787" font-weight="600">$ </text><text x="36.4" y="274.79999999999995" fill="#c9d1d9">haic test src</text></g>
<g class="r10"><text x="22.0" y="304.24999999999994" fill="#3fb950">  ✓ </text><text x="50.9" y="304.24999999999994" fill="#c9d1d9">placing an order freezes it</text></g>
<g class="r11"><text x="22.0" y="323.24999999999994" fill="#3fb950">  ✓ </text><text x="50.9" y="323.24999999999994" fill="#c9d1d9">an empty order cannot be placed</text></g>
<g class="r12"><text x="22.0" y="342.24999999999994" fill="#3fb950" font-weight="600">  2 passed</text><text x="94.2" y="342.24999999999994" fill="#6e7681">   — no code generated, no tokens spent</text></g>
<g class="r13"><text x="22.0" y="371.69999999999993" fill="#7ee787" font-weight="600">$ </text><text x="36.4" y="371.69999999999993" fill="#c9d1d9">haic build src --target typescript</text></g>
<g class="r14"><text x="22.0" y="390.69999999999993" fill="#58a6ff">✓ 16 files → </text><text x="115.9" y="390.69999999999993" fill="#c9d1d9">out/typescript</text></g>
<g class="r15"><text x="22.0" y="409.69999999999993" fill="#6e7681">  verify with: cd out/typescript &amp;&amp; npm run build</text></g>
<rect class="caret" x="22" y="418.69999999999993" width="7" height="13" fill="#c9d1d9"/>
</svg>
